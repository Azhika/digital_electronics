<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title"><title id="title">Ingress flows from a producer into a FIFO; egress flows to the consumer.</title><rect width="900" height="100%" rx="16" fill="#0d1726"/><g font-family="Arial, sans-serif" fill="#e5edf7"><text x="32" y="42" font-size="25" fill="#e5edf7">A buffer absorbs temporary differences in timing</text><rect x="35" y="95" width="220" height="105" rx="12" fill="#192c43" stroke="#52c9c0"/><text x="55" y="135" font-size="24" fill="#e5edf7">Producer</text><text x="55" y="172" font-size="17" fill="#e5edf7">Incoming data</text><rect x="340" y="95" width="220" height="105" rx="12" fill="#192c43" stroke="#52c9c0"/><text x="360" y="135" font-size="24" fill="#e5edf7">FIFO buffer</text><text x="360" y="172" font-size="17" fill="#e5edf7">Temporary storage</text><rect x="645" y="95" width="220" height="105" rx="12" fill="#192c43" stroke="#52c9c0"/><text x="665" y="135" font-size="24" fill="#e5edf7">Consumer</text><text x="665" y="172" font-size="17" fill="#e5edf7">Outgoing data</text><path d="M260 145 h65 m-12 -8 12 8 -12 8" fill="none" stroke="#52c9c0" stroke-width="3"/><path d="M565 145 h65 m-12 -8 12 8 -12 8" fill="none" stroke="#52c9c0" stroke-width="3"/><text x="270" y="125" font-size="14" fill="#e5edf7">Ingress</text><text x="572" y="125" font-size="14" fill="#e5edf7">Egress</text><text x="35" y="260" font-size="22" fill="#e5edf7">Occupancy = data accepted − data removed</text></g></svg>