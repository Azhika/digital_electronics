<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="title"><title id="title">Occupancy at clocks zero through eight is zero, five, five, ten, five, five, zero, zero, zero bytes.</title><rect width="900" height="100%" rx="16" fill="#0d1726"/><g font-family="Arial, sans-serif" fill="#e5edf7"><text x="32" y="40" font-size="25" fill="#e5edf7">Burst example · occupancy after each clock edge</text><path d="M80 255 H835" stroke="#344963" stroke-dasharray="4 5"/><text x="35" y="261" font-size="17" fill="#e5edf7">0</text><path d="M80 180 H835" stroke="#344963" stroke-dasharray="4 5"/><text x="35" y="186" font-size="17" fill="#e5edf7">5</text><path d="M80 105 H835" stroke="#344963" stroke-dasharray="4 5"/><text x="35" y="111" font-size="17" fill="#e5edf7">10</text><text x="85" y="285" font-size="17" fill="#e5edf7">0</text><circle cx="90" cy="255" r="5" fill="#52c9c0"/><text x="175" y="285" font-size="17" fill="#e5edf7">1</text><path d="M90 255 H180 V180" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="180" cy="180" r="5" fill="#52c9c0"/><text x="265" y="285" font-size="17" fill="#e5edf7">2</text><path d="M180 180 H270 V180" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="270" cy="180" r="5" fill="#52c9c0"/><text x="355" y="285" font-size="17" fill="#e5edf7">3</text><path d="M270 180 H360 V105" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="360" cy="105" r="5" fill="#52c9c0"/><text x="445" y="285" font-size="17" fill="#e5edf7">4</text><path d="M360 105 H450 V180" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="450" cy="180" r="5" fill="#52c9c0"/><text x="535" y="285" font-size="17" fill="#e5edf7">5</text><path d="M450 180 H540 V180" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="540" cy="180" r="5" fill="#52c9c0"/><text x="625" y="285" font-size="17" fill="#e5edf7">6</text><path d="M540 180 H630 V255" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="630" cy="255" r="5" fill="#52c9c0"/><text x="715" y="285" font-size="17" fill="#e5edf7">7</text><path d="M630 255 H720 V255" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="720" cy="255" r="5" fill="#52c9c0"/><text x="805" y="285" font-size="17" fill="#e5edf7">8</text><path d="M720 255 H810 V255" fill="none" stroke="#52c9c0" stroke-width="3"/><circle cx="810" cy="255" r="5" fill="#52c9c0"/><text x="33" y="77" font-size="16" fill="#e5edf7">Bytes</text><text x="765" y="319" font-size="17" fill="#e5edf7">Clock</text><text x="408" y="90" font-size="19" fill="#f7c873">Peak: 10 B → 2 × 40-bit entries</text></g></svg>